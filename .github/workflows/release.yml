name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 22
  DOTNET_VERSION: 8.0.x
  PORTWATCH_UPDATE_CHANNEL: stable
  PORTWATCH_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          TAG="${GITHUB_REF_NAME}"
          if [[ "v${VERSION}" != "${TAG}" ]]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  package:
    name: ${{ matrix.name }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 release
            os: macos-14
            platform: darwin
            arch: arm64
            verify-platform: darwin
            artifact-name: portwatch-darwin-arm64
            artifact-path: release/velopack/darwin-arm64
          - name: Windows x64 release
            os: windows-latest
            platform: win32
            arch: x64
            verify-platform: win32
            artifact-name: portwatch-win32-x64
            artifact-path: release/velopack/win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Prepare macOS signing
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          CERT_PATH: ${{ runner.temp }}/portwatch-signing.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/portwatch-signing.keychain-db
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.MACOS_NOTARY_API_KEY_ID }}.p8
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          required_vars=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_INSTALLER_IDENTITY
            MACOS_KEYCHAIN_PASSWORD
            MACOS_NOTARY_API_ISSUER
            MACOS_NOTARY_API_KEY_ID
            MACOS_NOTARY_API_KEY_P8_BASE64
            MACOS_SIGN_IDENTITY
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"])
          )
          Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_NOTARY_API_KEY_P8_BASE64"])
          )
          PY

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${MACOS_KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db

          {
            echo "CERT_PATH=${CERT_PATH}"
            echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "NOTARY_KEY_PATH=${NOTARY_KEY_PATH}"
            echo "PORTWATCH_APPLE_INSTALLER_IDENTITY=${MACOS_INSTALLER_IDENTITY}"
            echo "PORTWATCH_APPLE_KEYCHAIN=${KEYCHAIN_PATH}"
            echo "PORTWATCH_APPLE_NOTARY_API_KEY_ID=${MACOS_NOTARY_API_KEY_ID}"
            echo "PORTWATCH_APPLE_NOTARY_API_KEY_PATH=${NOTARY_KEY_PATH}"
            echo "PORTWATCH_APPLE_NOTARY_API_ISSUER=${MACOS_NOTARY_API_ISSUER}"
            echo "PORTWATCH_APPLE_SIGN_IDENTITY=${MACOS_SIGN_IDENTITY}"
          } >> "${GITHUB_ENV}"

      - name: Prepare Windows signing
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_SIGN_DESCRIPTION: ${{ vars.WINDOWS_SIGN_DESCRIPTION }}
          WINDOWS_SIGN_WEBSITE: ${{ vars.WINDOWS_SIGN_WEBSITE }}
          WINDOWS_TIMESTAMP_SERVER: ${{ vars.WINDOWS_TIMESTAMP_SERVER }}
        run: |
          $required = @('WINDOWS_CERTIFICATE_PASSWORD', 'WINDOWS_CERTIFICATE_PFX_BASE64')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Error "Missing required GitHub secret: $name"
              exit 1
            }
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'portwatch-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )

          $signDescription = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_DESCRIPTION)) {
            'PortWatch'
          } else {
            $env:WINDOWS_SIGN_DESCRIPTION
          }
          $timestampServer = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_SERVER)) {
            'http://timestamp.digicert.com'
          } else {
            $env:WINDOWS_TIMESTAMP_SERVER
          }

          @(
            "WINDOWS_CERTIFICATE_FILE=$certificatePath"
            "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD"
            "WINDOWS_SIGN_DESCRIPTION=$signDescription"
            "WINDOWS_SIGN_WEBSITE=$env:WINDOWS_SIGN_WEBSITE"
            "WINDOWS_TIMESTAMP_SERVER=$timestampServer"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Verify native port commands
        run: pnpm run verify:ports

      - name: Verify Windows parser fixtures
        run: pnpm run verify:windows-parser

      - name: Build Electron app
        run: pnpm run build

      - name: Prepare Velopack CLI
        run: pnpm run prepare:velopack

      - name: Package Electron app
        run: node script/package-electron.mjs app --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Package Velopack release
        run: node script/package-electron.mjs velopack --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Sign release assets
        run: pnpm run sign:release-assets -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Verify release artifacts
        run: node script/verify-electron-release.mjs --platform=${{ matrix.verify-platform }}

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Cleanup macOS signing keychain
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi

  publish:
    name: Publish GitHub release
    needs:
      - verify-version
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --title "PortWatch ${RELEASE_VERSION}" \
              --notes "Automated release for PortWatch ${RELEASE_VERSION}."
          fi

          while IFS= read -r -d '' file; do
            gh release upload "${RELEASE_TAG}" "${file}" --clobber
          done < <(find release-assets -type f -print0 | sort -z)

          gh release edit "${RELEASE_TAG}" --draft=false

          release_url=$(gh release view "${RELEASE_TAG}" --json url --jq '.url')
          {
            echo "## PortWatch Release"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Update URL: \`${PORTWATCH_UPDATE_URL}\`"
            echo "- Release: ${release_url}"
            echo
            echo "### Assets"
            find release-assets -type f | sort | sed 's#^#- `#; s#$#`#'
          } >> "${GITHUB_STEP_SUMMARY}"
